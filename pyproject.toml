[project]
name = "comfyui-bada-utils"
version = "1.0.3"
description = "⚓ All-in-One Quality of Life, Smart Presets Hub, Visual Regional Prompting & Async Gemini Studio for ComfyUI"
readme = "README.md"
authors = [
    { name = "bada-ya", email = "solokjd@gmail.com" }
]
license = { text = "MIT" }
dependencies = [
    "aiohttp>=3.8.0",
    "Pillow>=9.0.0",
    # Cloud Sync. Also listed in requirements.txt, and __init__.py keeps a
    # first-boot `pip install` fallback for manual git-clone installs where
    # nothing reads requirements.txt. Both paths are intentional.
    "google-api-python-client>=2.100.0",
    "google-auth-oauthlib>=1.1.0",
]

[project.urls]
Repository = "https://github.com/bada-ya/ComfyUI-Bada-Utils"
Homepage = "https://github.com/bada-ya/ComfyUI-Bada-Utils"

[tool.comfy]
PublisherId = "bada-ya"
DisplayName = "ComfyUI-Bada-Utils"
Icon = "https://raw.githubusercontent.com/bada-ya/ComfyUI-Bada-Utils/main/assets/bada_icon.png"
Banner = "https://raw.githubusercontent.com/bada-ya/ComfyUI-Bada-Utils/main/docs/images/bada_banner.png"
Includes = [
    "nodes",
    "server",
    "web",
    "workflows",
    "assets",
    # "docs" is deliberately NOT packaged: every README/banner image is referenced
    # through raw.githubusercontent.com, so shipping 12MB of screenshots only bloats
    # node.zip (~12.9MB → ~1MB) without changing what users see.
    "__init__.py",
    "translation_runtime.py",
    "presets_default.json",
    "node_list.json",
    "config.example.json",
    "LICENSE",
    "README.md",
    "README_ko.md"
]

